name: CPU checks
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-cpu-lock.txt -e '.[test]'
      - run: python -m pytest -q
      - run: eda-gpu validate --output runs/ci-validation
